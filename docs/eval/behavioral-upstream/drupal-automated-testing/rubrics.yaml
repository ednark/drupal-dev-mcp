rubrics:
- id: drupal_automated_testing_b01
  version: '1.0'
  applicable_bundles:
  - drupal_automated_testing
  checks:
  - kind: must_contain_any
    values:
    - KernelTestBase
    - RunTestsInSeparateProcesses
  - kind: must_not_contain
    values:
    - extends UnitTestCase
    - extends BrowserTestBase
  - kind: php_lint
  scoring:
    combine: all_pass
